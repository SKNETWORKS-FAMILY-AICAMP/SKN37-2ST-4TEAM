[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-gbm"
version = "1.0.0"
description = "음악 스트리밍 고객 이탈 예측 - gradient boosting"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "pyyaml", "joblib"]

[project.optional-dependencies]
full = ["lightgbm", "xgboost", "catboost", "shap", "pytest"]

[project.scripts]
churn = "churn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
